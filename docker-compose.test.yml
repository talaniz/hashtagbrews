services:
  postgres:
    image: postgres:10
    platform: linux/amd64
    environment:
      POSTGRES_DB: hashtagbrews
      POSTGRES_USER: hashtagbrews
      POSTGRES_PASSWORD: hashtagbrews-test
    ports:
      - "127.0.0.1:5432:5432"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:5.6.16
    platform: linux/amd64
    command:
      - elasticsearch
      - -Ebootstrap.system_call_filter=false
      - -Expack.security.enabled=false
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
